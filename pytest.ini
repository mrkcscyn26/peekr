[pytest]
testpaths = tests
# Temp folders live in the project because AppData (the default pytest temp root) is a
# blocked system folder for POST /api/folders.
addopts = -p no:cacheprovider --basetemp=.pytest_tmp
filterwarnings =
    ignore::DeprecationWarning:fastapi.testclient
    ignore:Using `httpx` with `starlette.testclient`
